name: Keeli Guardrails

on:
  pull_request:
    branches: [ "main" ]

jobs:
  keeli-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Keeli
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Keeli Status
        run: |
          keeli status

      - name: Check AI Log Updates
        run: |
          # Ensure ai_log.md was modified in this PR
          if git diff --name-only origin/main...HEAD | grep -q "docs/ai_log.md"; then
            echo "✅ ai_log.md was updated."
          else
            echo "❌ Error: docs/ai_log.md was not updated in this PR. Please run 'keeli log' to document your changes."
            exit 1
          fi

      - name: Check for Incomplete Tasks
        run: |
          # Ensure no tasks are left In Progress or Review when merging to main
          INCOMPLETE=$(keeli list --status in-progress)
          if [[ "$INCOMPLETE" != *"No tasks found"* ]]; then
            echo "❌ Error: There are tasks still 'In Progress'. Please complete them before merging."
            exit 1
          fi
          
          REVIEW=$(keeli list --status review)
          if [[ "$REVIEW" != *"No tasks found"* ]]; then
            echo "❌ Error: There are tasks still in 'Review'. Please complete them before merging."
            exit 1
          fi
          
          echo "✅ All active tasks are completed or blocked."